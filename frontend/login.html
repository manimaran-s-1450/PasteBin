<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteBin - Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B5CF6'><path d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/><rect x='8' y='2' width='8' height='4' rx='1' ry='1'/></svg>">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/create.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <div id="particles-container" class="particles-container" aria-hidden="true"></div>

  <!-- Standalone Header Navigation -->
  <header class="navbar-wrapper">
    <div class="container navbar-container">
      <a href="index.html" class="nav-brand">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <span class="logo-text">Paste<span class="logo-highlight">Bin</span></span>
      </a>
      <a href="index.html" style="color: #94A3B8; text-decoration: none; font-size: 0.9rem; font-weight: 600;">← Back to Home</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 420px; background: rgba(13, 15, 29, 0.94); backdrop-filter: blur(24px); border: 1px solid rgba(139, 92, 246, 0.35); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 25px 60px -15px rgba(139, 92, 246, 0.3); text-align: center;">
      
      <div style="width: 52px; height: 52px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      </div>

      <h1 style="font-size: 1.75rem; font-weight: 800; color: white; margin-bottom: 0.5rem;">Welcome Back</h1>
      <p style="font-size: 0.875rem; color: #94A3B8; margin-bottom: 2rem;">Log in to access your saved pastes.</p>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem; text-align: left;">
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.4rem;">Email or Username</label>
          <input type="text" id="login-identity" placeholder="Enter your email or username" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; color: white; font-size: 0.9rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.4rem;">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; color: white; font-size: 0.9rem; outline: none;">
        </div>

        <button type="submit" id="btn-login-submit" style="width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);">
          Sign In
        </button>
      </form>

      <p style="margin-top: 1.75rem; font-size: 0.85rem; color: #94A3B8;">
        Don't have an account? <a href="signup.html" style="color: #A78BFA; font-weight: 600; text-decoration: none;">Create Account</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
