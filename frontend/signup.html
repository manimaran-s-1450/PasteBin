<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteBin - Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B5CF6'><path d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/><rect x='8' y='2' width='8' height='4' rx='1' ry='1'/></svg>">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/create.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <div id="particles-container" class="particles-container" aria-hidden="true"></div>

  <!-- Global Header Navigation Mount Point -->
  <div id="navbar-container"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 440px; background: rgba(13, 15, 29, 0.94); backdrop-filter: blur(24px); border: 1px solid rgba(139, 92, 246, 0.35); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 25px 60px -15px rgba(139, 92, 246, 0.3); text-align: center;">
      
      <div style="width: 52px; height: 52px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </div>

      <h1 style="font-size: 1.75rem; font-weight: 800; color: white; margin-bottom: 0.5rem;">Create Account</h1>
      <p style="font-size: 0.875rem; color: #94A3B8; margin-bottom: 2rem;">Sign up to save, manage, and organize your code pastes.</p>

      <form id="signup-form" style="display: flex; flex-direction: column; gap: 1.1rem; text-align: left;">
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.4rem;">Username</label>
          <input type="text" id="signup-username" placeholder="Choose a username" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; color: white; font-size: 0.9rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.4rem;">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@example.com" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; color: white; font-size: 0.9rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #CBD5E1; margin-bottom: 0.4rem;">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px; color: white; font-size: 0.9rem; outline: none;">
        </div>

        <button type="submit" id="btn-signup-submit" style="width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #8B5CF6, #6D28D9); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);">
          Create Account
        </button>
      </form>

      <p style="margin-top: 1.75rem; font-size: 0.85rem; color: #94A3B8;">
        Already have an account? <a href="login.html" style="color: #A78BFA; font-weight: 600; text-decoration: none;">Sign In</a>
      </p>
    </div>
  </main>

  <!-- Global Footer Container Mount Point -->
  <div id="footer-container"></div>

  <script type="module" src="components/navbar.js"></script>
  <script type="module" src="components/footer.js"></script>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
